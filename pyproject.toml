[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-agent"
version = "0.1.0"
description = "OHDSI Study Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.12",
  "faiss-cpu>=1.13",
  "flask>=3.1",
  "mcp>=1.10,<2",
  "httpx>=0.27.1,<1",
  "numpy>=2.4",
  "omop-alchemy==0.6.0",
  "orm-loader==0.3.26",
  "pydantic>=2.0.0",
  "psycopg[binary]>=3.1,<4",
  "PyYAML>=6.0",
  "requests>=2.33",
  "sqlalchemy>=2.0",
  
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.11.0",
  "doit"
]

[project.scripts]
study-agent-mcp = "study_agent_core.config_cli:mcp_main"
study-agent-acp = "study_agent_core.config_cli:acp_main"
study-agent-demo-shell = "study_agent_acp.demo_shell:main"
study-agent-setup = "study_agent_core.env_wizard:main"
study-agent-build-phenotype-index = "study_agent_mcp.phenotype_index_builder:main"

[tool.setuptools]
packages = ["study_agent_core", "study_agent_mcp", "study_agent_acp"]

[tool.setuptools.package-dir]
study_agent_core = "core/study_agent_core"
study_agent_mcp = "mcp_server/study_agent_mcp"
study_agent_acp = "acp_agent/study_agent_acp"
