name: study-agent

services:
  mcp-server:
    build:
      context: .
    image: study-agent
    env_file:
      - path: secrets.env
        required: false
      - path: .env
        required: false  # legacy secret-only compatibility
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data/phenotype_index:/data/phenotype_index
    ports:
      - "8790:8790"
    command: ["micromamba", "run", "-n", "base", "study-agent-mcp", "--config", "/app/config.yaml", "--profile", "docker"]
    restart: unless-stopped

  acp-agent:
    build:
      context: .
    image: study-agent
    env_file:
      - path: secrets.env
        required: false
      - path: .env
        required: false  # legacy secret-only compatibility
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8765:8765"
    depends_on:
      - mcp-server
    command: ["micromamba", "run", "-n", "base", "study-agent-acp", "--config", "/app/config.yaml", "--profile", "docker"]
    restart: unless-stopped
