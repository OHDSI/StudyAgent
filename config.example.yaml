# Copy to config.yaml and adjust non-secret deployment settings.
# Secrets stay in secrets.env (Docker Compose) or process environment variables.
version: 1
profile: native

paths:
  phenotype_index: data/phenotype_index
  logs: study-agent-logs
  runtime: .study-agent-runtime

acp:
  bind: {host: 127.0.0.1, port: 8765}
  public_url: http://127.0.0.1:8765
  mcp:
    mode: http
    url: http://127.0.0.1:8790/mcp
    timeout_seconds: 240

mcp:
  transport: http
  bind: {host: 127.0.0.1, port: 8790}
  path: /mcp

llm:
  api_url: http://localhost:3000/api/chat/completions
  model: agentstudyassistant
  # Set to none for a keyless local shim; the ACP then omits Authorization.
  authentication: required
  timeout_seconds: 300
  use_responses_api: false
  # LLM request diagnostics; keep prompt and response logging off unless needed.
  log: false
  log_prompt: false
  log_response: false
  log_json: false

retrieval:
  embedding_url: http://localhost:3000/ollama/api/embed
  embedding_model: qwen3-embedding:4b
  timeout_seconds: 120
  # EMBED_LOG
  log: false

logging:
  # STUDY_AGENT_LOG_LEVEL; change to DEBUG for service troubleshooting.
  level: INFO
  # Optional per-service overrides: ACP_LOG_LEVEL and MCP_LOG_LEVEL.
  # Explicit output files (ACP_LOG_FILE and MCP_LOG_FILE). Paths are config-relative.
  acp_file: study-agent-logs/study-agent-acp.log
  mcp_file: study-agent-logs/study-agent-mcp.log
  # acp_level: DEBUG
  # mcp_level: DEBUG
  acp_to_console: true
  mcp_to_console: true

profiles:
  docker:
    network:
      rewrite_container_hosts: true
    # Use host.docker.internal for LLM/embedding services running on the Docker host.
    llm:
      api_url: http://host.docker.internal:3000/api/chat/completions
    retrieval:
      embedding_url: http://host.docker.internal:3000/ollama/api/embed
    acp:
      bind: {host: 0.0.0.0, port: 8765}
      mcp:
        mode: http
        url: http://mcp-server:8790/mcp
    mcp:
      bind: {host: 0.0.0.0, port: 8790}
    paths:
      phenotype_index: /data/phenotype_index
